<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#2B1D13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>MOTU — Moments of the Unknown</title>
  <meta name="description" content="Point your phone at a painting and watch the moment it came from." />
  <link rel="icon" href="./icon-180.png" type="image/png" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="manifest" href="./app.webmanifest" />
  <link rel="preload" href="./brand/parchment.jpg" as="image" />
</head>
<body>
  <div id="stage">
    <video id="camera" playsinline muted autoplay></video>
    <canvas id="gl"></canvas>
  </div>

  <section id="intro" class="paper" aria-live="polite">
    <div class="frame" aria-hidden="true"></div>
    <div class="intro-inner">
      <header class="intro-top">
        <img class="crest" src="./brand/crest.png" alt="" />
        <h1><img class="wordmark" src="./brand/wordmark.png" alt="Moments of the Unknown" /></h1>
        <p class="dateline"><span>11.11</span> <em>on East 11</em></p>
        <div class="double-rule" aria-hidden="true"></div>
        <p class="sc ruled">See the Paintings come Alive</p>
      </header>
      <figure class="plate">
        <img src="./brand/plate-001.jpg" alt="No. 001, Knight of Cups" />
        <figcaption>No. 001 — April 8, 2023</figcaption>
      </figure>
      <footer class="intro-bottom">
        <div class="double-rule" aria-hidden="true"></div>
        <button id="start" disabled><span class="label">Preparing…</span><span class="bar"></span></button>
        <p class="sc fine" id="intro-note">Point at any Painting · Sound On</p>
        <div class="short-rule" aria-hidden="true"></div>
        <p class="sc credit">Curated by Justin Aversano and Viktoria Nagibina</p>
      </footer>
    </div>
  </section>

  <div id="header" class="paper tab"><img src="./brand/crest.png" alt="" /><span>MOTU</span></div>
  <div id="hint" class="paper">Point at a painting — hold steady</div>

  <section id="card" class="paper" aria-live="polite">
    <div class="frame" aria-hidden="true"></div>
    <p id="caption"></p>
    <h2 id="title"></h2>
    <div class="double-rule" aria-hidden="true"></div>
    <div class="slider">
      <label for="opacity" class="sc">Film</label>
      <input id="opacity" type="range" min="0" max="100" step="1" value="100" />
      <span id="opacity-value">100%</span>
    </div>
    <div class="buttons">
      <button id="sound-btn" class="btn">
        <svg class="on" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3V5L6 8H3z"/><path d="M13.5 7.5a3.5 3.5 0 0 1 0 5M15.5 5.5a6.5 6.5 0 0 1 0 9"/></svg>
        <svg class="off" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8v4h3l4 3V5L6 8H3z"/><path d="M13 8l4 4M17 8l-4 4"/></svg>
        <span>Sound</span>
      </button>
      <button id="poet-btn" class="btn">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h8l3 3v11H5z"/><path d="M8 9h6M8 12h6M8 15h4"/></svg>
        <span>Poet</span>
      </button>
      <button id="shot-btn" class="btn">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 6.5h3l1.5-2h6l1.5 2h3v9h-15z"/><circle cx="10" cy="11" r="3"/></svg>
        <span>Photo</span>
      </button>
      <button id="record-btn" class="btn"><span class="rec-dot"></span><span>Record</span></button>
    </div>
  </section>

  <section id="diary" class="paper" aria-live="polite">
    <div class="frame" aria-hidden="true"></div>
    <div class="diary-head">
      <span class="sc strong">Poet Mode</span>
      <span class="head-btns">
        <button id="diary-min" class="icon" aria-label="Fold the journal away and see the painting"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg></button>
        <button id="diary-close" class="icon" aria-label="Leave Poet Mode"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
      </span>
    </div>
    <p id="diary-caption"></p>
    <h2 id="diary-title"></h2>
    <div class="double-rule" aria-hidden="true"></div>
    <div id="diary-body"></div>
    <div class="narration">
      <button id="diary-play" class="icon play" aria-label="Pause the reading"><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z"/></svg></button>
      <div class="narr-col">
        <div class="track"><div id="narr-progress"></div></div>
        <span class="sc">Read by Justin Aversano</span>
      </div>
    </div>
  </section>

  <section id="poet-bar" class="paper" aria-label="Poet Mode reading">
    <div class="frame" aria-hidden="true"></div>
    <button id="bar-play" class="icon play" aria-label="Pause the reading"><svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9"/></svg><svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.6 8z"/></svg></button>
    <button id="bar-open" class="bar-text" aria-label="Show the journal">
      <span id="bar-caption"></span>
      <span id="bar-title"></span>
    </button>
    <button id="bar-expand" class="icon" aria-label="Show the journal"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 10l5-5 5 5"/></svg></button>
    <button id="bar-close" class="icon" aria-label="Leave Poet Mode"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
    <div class="bar-track" aria-hidden="true"><div id="bar-progress"></div></div>
  </section>

  <div id="rec-border"></div>
  <div id="toast" class="paper"></div>
  <pre id="debug"></pre>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
